name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  publish-tauri:
    name: Build desktop package (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            args: ''
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || vars.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || vars.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      MACOS_SELF_SIGN_P12: ${{ secrets.MACOS_SELF_SIGN_P12 }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
      NODE_OPTIONS: --max-old-space-size=8192
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: node --max-old-space-size=8192 ./node_modules/vite/bin/vite.js build --config ./config/vite.config.prod.ts

      - name: Prepare Tauri config for CI packaging
        shell: bash
        run: |
          bun --eval "
            const fs = require('fs');
            const path = 'src-tauri/tauri.conf.json';
            const config = JSON.parse(fs.readFileSync(path, 'utf8'));
            config.build.beforeBuildCommand = '';
            if (!process.env.TAURI_SIGNING_PRIVATE_KEY) {
              config.bundle.createUpdaterArtifacts = false;
            }
            fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          "

      - name: Import macOS self-signed certificate
        if: matrix.platform == 'macos-latest' && env.MACOS_SELF_SIGN_P12 != ''
        run: |
          echo "$MACOS_SELF_SIGN_P12" | base64 --decode > codesign.p12
          security create-keychain -p "build" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "build" build.keychain
          security import codesign.p12 -k build.keychain -f pkcs12 -A -P "greptime123"
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | sed s/\"//g)
          rm codesign.p12

      - name: Import Windows certificate
        if: matrix.platform == 'windows-latest' && env.WINDOWS_CERTIFICATE != ''
        run: |
          New-Item -ItemType directory -Path certificate
          Set-Content -Path certificate/tempCert.txt -Value $env:WINDOWS_CERTIFICATE
          certutil -decode certificate/tempCert.txt certificate/certificate.pfx
          Remove-Item -path certificate -include tempCert.txt
          Import-PfxCertificate -FilePath certificate/certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText)

      - name: Update Tauri version to match tag
        shell: bash
        run: |
          VERSION=${RELEASE_TAG#v}
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            powershell -Command "(Get-Content src-tauri/tauri.conf.json) -replace '\"version\": \"[^\"]*\"', '\"version\": \"$VERSION\"' | Set-Content src-tauri/tauri.conf.json"
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            sed -i '' "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          else
            sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          fi

      - name: Build and publish desktop package
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Greptime Dashboard ${{ github.ref_name }}
          releaseBody: |
            Download the Windows, macOS, and Linux installers from the release assets.

            ## macOS Installation

            If you see **"Greptime Dashboard is damaged and can't be opened"**, run the following command in Terminal after installation:

            ```bash
            xattr -dr com.apple.quarantine "/Applications/Greptime Dashboard.app"
            ```

            This is caused by macOS Gatekeeper. The app is not notarized with an Apple Developer certificate.
          releaseDraft: false
          prerelease: false
          assetNamePattern: Greptime-Dashboard-${{ github.ref_name }}-[platform]-[arch]-[bundle][setup][ext]
          args: ${{ matrix.args }}

      - name: Sign macOS DMG with self-signed certificate
        if: matrix.platform == 'macos-latest' && env.MACOS_SELF_SIGN_P12 != ''
        run: |
          echo "Available identities:"
          security find-identity -v -p codesigning
          DMG=$(find src-tauri/target -name "*.dmg" | head -1)
          if [ -n "$DMG" ]; then
            IDENTITY=$(security find-identity -v build.keychain | grep "Greptime" | head -1 | awk -F '"' '{print $2}')
            echo "Using identity: $IDENTITY"
            if [ -n "$IDENTITY" ]; then
              codesign --force --sign "$IDENTITY" --keychain build.keychain "$DMG"
            else
              echo "No identity found, skipping signing"
            fi
          fi

      - name: Upload CA certificate to release (macOS only, once)
        if: matrix.platform == 'macos-latest' && matrix.args == '--target aarch64-apple-darwin' && env.MACOS_SELF_SIGN_P12 != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: certs/ca.crt
          name: Greptime Dashboard ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
