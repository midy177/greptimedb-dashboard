name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  publish-tauri:
    name: Build desktop package (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    environment: build
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            args: ''
    env:
      TAURI_SIGNING_PRIVATE_KEY_B64: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || vars.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || vars.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      MACOS_SELF_SIGN_P12: ${{ secrets.MACOS_SELF_SIGN_P12 }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
      NODE_OPTIONS: --max-old-space-size=8192
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Decode signing key
        shell: bash
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY_B64" ]; then
            DECODED=$(echo "$TAURI_SIGNING_PRIVATE_KEY_B64" | base64 -d 2>/dev/null || echo "$TAURI_SIGNING_PRIVATE_KEY_B64")
            echo "TAURI_SIGNING_PRIVATE_KEY<<EOF" >> $GITHUB_ENV
            echo "$DECODED" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          fi

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: node --max-old-space-size=8192 ./node_modules/vite/bin/vite.js build --config ./config/vite.config.prod.ts

      - name: Prepare Tauri config for CI packaging
        shell: bash
        run: |
          bun --eval "
            const fs = require('fs');
            const path = 'src-tauri/tauri.conf.json';
            const config = JSON.parse(fs.readFileSync(path, 'utf8'));
            config.build.beforeBuildCommand = '';
            fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          "

      - name: Import macOS self-signed certificate
        if: matrix.platform == 'macos-latest' && env.MACOS_SELF_SIGN_P12 != ''
        run: |
          echo "$MACOS_SELF_SIGN_P12" | base64 --decode > codesign.p12
          security create-keychain -p "build" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "build" build.keychain
          security import codesign.p12 -k build.keychain -f pkcs12 -A -P "greptime123"
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | sed s/\"//g)
          rm codesign.p12

      - name: Import Windows certificate
        if: matrix.platform == 'windows-latest' && env.WINDOWS_CERTIFICATE != ''
        run: |
          New-Item -ItemType directory -Path certificate
          Set-Content -Path certificate/tempCert.txt -Value $env:WINDOWS_CERTIFICATE
          certutil -decode certificate/tempCert.txt certificate/certificate.pfx
          Remove-Item -path certificate -include tempCert.txt
          Import-PfxCertificate -FilePath certificate/certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText)

      - name: Update Tauri version to match tag
        shell: bash
        run: |
          VERSION=${RELEASE_TAG#v}
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            powershell -Command "(Get-Content src-tauri/tauri.conf.json) -replace '\"version\": \"[^\"]*\"', '\"version\": \"$VERSION\"' | Set-Content src-tauri/tauri.conf.json"
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            sed -i '' "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          else
            sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          fi

      - name: Build and publish desktop package
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Greptime Dashboard ${{ github.ref_name }}
          releaseBody: |
            Download the Windows, macOS, and Linux installers from the release assets.

            ## macOS Installation

            If you see **"Greptime Dashboard is damaged and can't be opened"**, run the following command in Terminal after installation:

            ```bash
            xattr -dr com.apple.quarantine "/Applications/Greptime Dashboard.app"
            ```

            This is caused by macOS Gatekeeper. The app is not notarized with an Apple Developer certificate.
          releaseDraft: false
          prerelease: false
          assetNamePattern: Greptime-Dashboard-${{ github.ref_name }}-[platform]-[arch]-[bundle][setup][ext]
          args: ${{ matrix.args }}

      - name: Sign macOS DMG with self-signed certificate
        if: matrix.platform == 'macos-latest' && env.MACOS_SELF_SIGN_P12 != ''
        run: |
          echo "Available identities:"
          security find-identity -v -p codesigning
          DMG=$(find src-tauri/target -name "*.dmg" | head -1)
          if [ -n "$DMG" ]; then
            IDENTITY=$(security find-identity -v build.keychain | grep "Greptime" | head -1 | awk -F '"' '{print $2}')
            echo "Using identity: $IDENTITY"
            if [ -n "$IDENTITY" ]; then
              codesign --force --sign "$IDENTITY" --keychain build.keychain "$DMG"
            else
              echo "No identity found, skipping signing"
            fi
          fi

      - name: Upload CA certificate to release (macOS only, once)
        if: matrix.platform == 'macos-latest' && matrix.args == '--target aarch64-apple-darwin' && env.MACOS_SELF_SIGN_P12 != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: certs/ca.crt
          name: Greptime Dashboard ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect updater artifacts
        shell: bash
        run: |
          mkdir -p updater-artifacts
          # collect .sig files and the nsis/msi/app.tar.gz updater bundles
          find src-tauri/target -name "*.sig" | while read f; do
            cp "$f" updater-artifacts/
          done
          find src-tauri/target -name "*.app.tar.gz" | while read f; do
            cp "$f" updater-artifacts/
          done
          find src-tauri/target -name "*.nsis.zip" -o -name "*.msi.zip" | while read f; do
            cp "$f" updater-artifacts/
          done
          ls -la updater-artifacts/ || true

      - name: Upload updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: updater-${{ matrix.platform }}-${{ strategy.job-index }}
          path: updater-artifacts/
          if-no-files-found: ignore
          retention-days: 1

  generate-latest-json:
    name: Generate latest.json
    needs: publish-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Download all updater artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: updater-*
          path: updater-artifacts
          merge-multiple: true

      - name: List collected artifacts
        run: ls -la updater-artifacts/ || echo "No artifacts found"

      - name: Generate latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          REPO="midy177/greptimedb-dashboard"
          BASE_URL="https://github.com/${REPO}/releases/download/${RELEASE_TAG}"

          # Build platforms object from collected .sig files
          PLATFORMS="{}"

          for SIG_FILE in updater-artifacts/*.sig; do
            [ -f "$SIG_FILE" ] || continue
            BASENAME=$(basename "$SIG_FILE" .sig)
            SIG=$(cat "$SIG_FILE")
            URL="${BASE_URL}/${BASENAME}"

            # Detect platform/arch from filename
            case "$BASENAME" in
              *aarch64-apple-darwin* | *aarch64_apple_darwin*)
                PLATFORM="darwin-aarch64"
                ;;
              *x86_64-apple-darwin* | *x86_64_apple_darwin*)
                PLATFORM="darwin-x86_64"
                ;;
              *x86_64*windows* | *x64-setup* | *.msi* | *.nsis*)
                PLATFORM="windows-x86_64"
                ;;
              *x86_64*linux* | *amd64*)
                PLATFORM="linux-x86_64"
                ;;
              *)
                echo "Unrecognized platform for: $BASENAME, skipping"
                continue
                ;;
            esac

            PLATFORMS=$(echo "$PLATFORMS" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          platform = '${PLATFORM}'
          data[platform] = {'signature': '''${SIG}''', 'url': '${URL}'}
          print(json.dumps(data))
          ")
          done

          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          echo "$PLATFORMS" | python3 -c "
          import json, sys
          platforms = json.load(sys.stdin)
          latest = {
            'version': '${VERSION}',
            'notes': 'See the release page for details.',
            'pub_date': '${PUB_DATE}',
            'platforms': platforms
          }
          print(json.dumps(latest, indent=2))
          " > latest.json

          echo "Generated latest.json:"
          cat latest.json

      - name: Upload latest.json to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
